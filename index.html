<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D응용연구팀 근태 현황</title>
<style>
  :root{
    --navy:#1f2a44; --navy2:#2b3a5c; --gold:#c9a24b; --paper:#f6f7f9;
    --line:#e2e5ea; --sat:#eaf1fb; --sunhol:#fce4ec; --ink:#232833; --muted:#8a90a0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--paper);color:var(--ink);}
  header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{font-size:12px;color:#b9c2d6;margin-top:2px}
  .btn{border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-gold{background:var(--gold);color:#241b03}
  .btn-gold:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  .btn-outline{background:#fff;color:var(--navy2);border:1px solid var(--line)}
  .btn-outline:hover{background:var(--paper)}
  main{max-width:1200px;margin:0 auto;padding:20px 24px 60px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row label{font-size:12px;color:var(--muted);margin-right:4px}
  input[type=text],input[type=password],select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;background:#fff}
  .settings{display:none}
  .settings.open{display:block}
  .toggle-link{font-size:12px;color:var(--navy2);cursor:pointer;text-decoration:underline;}
  .monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .monthbar .title{font-size:16px;font-weight:700}
  .navbtn{background:#fff;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:14px}
  table{border-collapse:collapse;width:100%;font-size:12px;}
  th,td{border:1px solid var(--line);text-align:center;padding:0;}
  th{background:var(--navy);color:#fff;font-weight:600;padding:6px 2px;position:sticky;top:0}
  .namecell{background:#f1f2f5;font-weight:700;padding:6px 8px;text-align:left;white-space:nowrap;position:sticky;left:0;min-width:110px}
  .me .namecell{background:#e8edfb;color:var(--navy2)}
  td.day{width:30px;height:28px;cursor:default;position:relative;font-size:11px}
  td.day.editable{cursor:pointer}
  td.day.editable:hover{outline:2px solid var(--gold);outline-offset:-2px}
  td.sat{background:var(--sat)}
  td.sunhol{background:var(--sunhol)}
  .code-연차{background:#b7d7f5}
  .code-오전반차{background:#d6e4f0}
  .code-오후반차{background:#d6e4f0}
  .code-출장{background:#c6e0b4}
  .code-재택{background:#e2efda}
  .code-교육{background:#d9d2e9}
  .code-병가{background:#f8cbad}
  .code-경조사{background:#d9b99b}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px}
  .legend span{padding:3px 8px;border-radius:4px;border:1px solid var(--line)}
  .status{font-size:12px;color:var(--muted);margin-top:8px}
  .status.dirty{color:#b45309;font-weight:600}
  .popup{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;display:none;}
  .popup.open{display:block}
  .popup button{display:block;width:120px;text-align:left;border:none;background:none;padding:6px 8px;font-size:12px;cursor:pointer;border-radius:5px}
  .popup button:hover{background:#f1f2f5}
  .monthblock{margin-bottom:22px}
  .monthblock .mtitle{font-size:13px;font-weight:700;color:var(--navy2);margin:0 0 6px 2px}
  .monthblock table{width:auto}
  td.today, th.today{box-shadow:inset 0 0 0 2px var(--gold)}
  #todayBarPanel{padding:14px 18px}
  .todaybar-title{font-size:13px;font-weight:700;color:var(--navy2);margin-bottom:10px}
  .todaybar-people{display:flex;gap:10px;flex-wrap:wrap}
  .tb-person{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:5px 12px 5px 6px;font-size:12px}
  .tb-icon{font-size:16px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;border:1px solid var(--line)}
  .tb-name{font-weight:700}
  .tb-code{color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <div>
    <h1>3D응용연구팀 근태 현황 (프로토타입)</h1>
    <div class="sub">2026년 · GitHub 저장 · 데모 버전 — 실제 데이터 사용 전 보안팀 확인 필요</div>
  </div>
  <div class="row">
    <button class="btn btn-ghost" id="refreshBtn">새로고침</button>
    <button class="btn btn-gold" id="saveBtn" disabled>저장</button>
  </div>
</header>

<main>
  <div class="panel">
    <div class="row">
      <span class="toggle-link" id="settingsToggle">GitHub 연결 설정 ▾</span>
    </div>
    <div class="settings" id="settingsBox">
      <div class="row" style="margin-top:10px">
        <label>owner</label><input type="text" id="ghOwner" placeholder="예: hyunseok-hd" style="width:140px">
        <label>repo</label><input type="text" id="ghRepo" placeholder="예: team-attendance" style="width:160px">
        <label>branch</label><input type="text" id="ghBranch" placeholder="main" style="width:80px">
        <label>token</label><input type="password" id="ghToken" placeholder="개인 액세스 토큰 (repo 쓰기 권한)" style="width:260px">
        <label>파일명</label><input type="text" id="ghPath" placeholder="attendance.json" style="width:140px">
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn btn-gold" id="ghSaveSettings">설정 저장</button>
        <span class="status">토큰은 이 브라우저에만 저장됩니다(localStorage). 서버로 전송되지 않으며, GitHub API 호출에만 사용됩니다.</span>
      </div>
    </div>
  </div>

  <div class="panel" id="todayBarPanel">
    <div id="todayBar"></div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:10px">
      <span class="status" id="loadStatus"></span>
    </div>
    <div class="monthbar">
      <button class="navbtn" id="prevMonth">‹</button>
      <div class="title" id="monthTitle">2026년 1월 ~ 3월</div>
      <button class="navbtn" id="nextMonth">›</button>
      <button class="btn btn-outline" id="todayJump" style="margin-left:10px">오늘로 이동</button>
    </div>
    <div id="gridContainer"></div>
    <div class="legend">
      <span class="code-연차">🌴 연차</span><span class="code-오전반차">🌓 오전반차</span><span class="code-오후반차">🌗 오후반차</span>
      <span class="code-출장">✈️ 출장</span><span class="code-재택">🏠 재택</span><span class="code-교육">🎓 교육</span>
      <span class="code-병가">🏥 병가</span><span class="code-경조사">🖤 경조사</span>
      <span style="background:var(--sat)">토요일</span><span style="background:var(--sunhol)">일요일·공휴일</span>
    </div>
    <div class="status" id="saveStatus"></div>
  </div>
</main>

<div class="popup" id="popup"></div>

<footer>내부 프로토타입 · 회사 보안 정책 검토 전 실제 근태 데이터 입력 비권장</footer>

<script>
const PEOPLE = ["정광호","김현석","민경훈","이광욱","이일우","이진욱","정국호"];
const CODES = ["연차","오전반차","오후반차","출장","재택","교육","병가","경조사"];
const HOLIDAYS = {
  "2026-01-01":"신정","2026-02-16":"설날연휴","2026-02-17":"설날","2026-02-18":"설날연휴",
  "2026-03-01":"삼일절","2026-03-02":"삼일절 대체공휴일","2026-05-01":"근로자의날","2026-05-05":"어린이날",
  "2026-05-24":"부처님오신날","2026-05-25":"부처님오신날 대체공휴일","2026-06-03":"지방선거일",
  "2026-06-06":"현충일","2026-07-17":"제헌절","2026-08-15":"광복절","2026-08-17":"광복절 대체공휴일",
  "2026-09-24":"추석연휴","2026-09-25":"추석","2026-09-26":"추석연휴","2026-10-03":"개천절",
  "2026-10-05":"개천절 대체공휴일","2026-10-09":"한글날","2026-12-25":"성탄절"
};
const ICONS = {"연차":"🌴","오전반차":"🌓","오후반차":"🌗","출장":"✈️","재택":"🏠","교육":"🎓","병가":"🏥","경조사":"🖤"};
const WD = ["월","화","수","목","금","토","일"];

function todayStr(){
  const t = new Date();
  return dateStr(t.getFullYear(), t.getMonth()+1, t.getDate());
}

let state = { data:{}, sha:null, year:new Date().getFullYear(), month:new Date().getMonth()+1, dirty:false };

function ls(k){return localStorage.getItem(k) || "";}
function saveSettings(){
  localStorage.setItem("gh_owner", document.getElementById("ghOwner").value.trim());
  localStorage.setItem("gh_repo", document.getElementById("ghRepo").value.trim());
  localStorage.setItem("gh_branch", document.getElementById("ghBranch").value.trim() || "main");
  localStorage.setItem("gh_token", document.getElementById("ghToken").value.trim());
  localStorage.setItem("gh_path", document.getElementById("ghPath").value.trim() || "attendance.json");
  loadFromGithub();
}
function loadSettingsUI(){
  document.getElementById("ghOwner").value = ls("gh_owner");
  document.getElementById("ghRepo").value = ls("gh_repo");
  document.getElementById("ghBranch").value = ls("gh_branch") || "main";
  document.getElementById("ghToken").value = ls("gh_token");
  document.getElementById("ghPath").value = ls("gh_path") || "attendance.json";
}

function ghHeaders(){
  return { "Authorization": "token " + ls("gh_token"), "Accept": "application/vnd.github+json" };
}
function ghUrl(){
  return `https://api.github.com/repos/${ls("gh_owner")}/${ls("gh_repo")}/contents/${ls("gh_path")}?ref=${ls("gh_branch")||"main"}`;
}

async function loadFromGithub(){
  const statusEl = document.getElementById("loadStatus");
  if(!ls("gh_owner") || !ls("gh_repo")){ statusEl.textContent = "GitHub 설정을 먼저 입력하세요."; return; }
  statusEl.textContent = "불러오는 중...";
  try{
    const res = await fetch(ghUrl(), { headers: ghHeaders() });
    if(res.status === 404){
      state.data = {}; state.sha = null;
      statusEl.textContent = "저장된 데이터 없음 (새 파일로 시작)";
    } else if(res.ok){
      const json = await res.json();
      state.sha = json.sha;
      const content = decodeURIComponent(escape(atob(json.content.replace(/\n/g,""))));
      state.data = JSON.parse(content || "{}");
      statusEl.textContent = "최신 데이터 불러옴 (" + new Date().toLocaleTimeString() + ")";
    } else {
      const err = await res.text();
      statusEl.textContent = "불러오기 실패: " + res.status + " " + err.slice(0,120);
    }
  }catch(e){ statusEl.textContent = "네트워크 오류: " + e.message; }
  state.dirty = false;
  renderGrid();
}

async function saveToGithub(){
  const statusEl = document.getElementById("saveStatus");
  if(!ls("gh_owner") || !ls("gh_repo") || !ls("gh_token")){
    statusEl.textContent = "GitHub 설정(특히 토큰)을 먼저 입력하세요."; return;
  }
  statusEl.textContent = "저장 중...";
  const body = {
    message: `attendance update ${new Date().toISOString()}`,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(state.data, null, 2)))),
    branch: ls("gh_branch") || "main"
  };
  if(state.sha) body.sha = state.sha;
  try{
    const res = await fetch(ghUrl().split("?")[0], {
      method:"PUT", headers: Object.assign({"Content-Type":"application/json"}, ghHeaders()),
      body: JSON.stringify(body)
    });
    if(res.ok){
      const json = await res.json();
      state.sha = json.content.sha;
      state.dirty = false;
      document.getElementById("saveBtn").disabled = true;
      statusEl.textContent = "저장 완료 (" + new Date().toLocaleTimeString() + ")";
      statusEl.classList.remove("dirty");
    } else {
      const err = await res.text();
      statusEl.textContent = "저장 실패: " + res.status + " " + err.slice(0,150);
    }
  }catch(e){ statusEl.textContent = "네트워크 오류: " + e.message; }
}

function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function dateStr(y,m,d){ return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }

function buildMonthTable(y,m){
  const nd = daysInMonth(y,m);
  const today = todayStr();
  let html = `<div class="monthblock"><div class="mtitle">${y}년 ${m}월</div><div style="overflow-x:auto"><table>`;
  html += "<thead><tr><th style='position:sticky;left:0'>이름</th>";
  for(let d=1; d<=nd; d++){
    const ds = dateStr(y,m,d);
    const wd = (new Date(y,m-1,d).getDay()+6)%7; // 0=월
    const cls = (HOLIDAYS[ds] ? "sunhol" : (wd===5?"sat":(wd===6?"sunhol":""))) + (ds===today?" today":"");
    html += `<th class="${cls}" title="${HOLIDAYS[ds]||''}">${d}<br><span style="font-weight:400">${WD[wd]}</span></th>`;
  }
  html += "</tr></thead><tbody>";
  for(const p of PEOPLE){
    html += `<tr><td class="namecell">${p}</td>`;
    for(let d=1; d<=nd; d++){
      const ds = dateStr(y,m,d);
      const wd = (new Date(y,m-1,d).getDay()+6)%7;
      const wkcls = (HOLIDAYS[ds] ? "sunhol" : (wd===5?"sat":(wd===6?"sunhol":""))) + (ds===today?" today":"");
      const code = (state.data[p] && state.data[p][ds]) || "";
      const codecls = code ? ("code-"+code) : "";
      html += `<td class="day ${wkcls} ${codecls} editable" data-person="${p}" data-date="${ds}" onclick="openPopup(event,'${p}','${ds}')">${code?ICONS[code]:""}</td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table></div></div>";
  return html;
}

function renderTodayBar(){
  const today = todayStr();
  const holidayName = HOLIDAYS[today];
  let html = `<div class="todaybar-title">오늘 (${today}${holidayName?" · "+holidayName:""}) 팀 현황</div><div class="todaybar-people">`;
  for(const p of PEOPLE){
    const code = (state.data[p] && state.data[p][today]) || "";
    html += `<div class="tb-person"><span class="tb-icon">${code?ICONS[code]:"💺"}</span><span class="tb-name">${p}</span><span class="tb-code">${code||"정상근무"}</span></div>`;
  }
  html += "</div>";
  document.getElementById("todayBar").innerHTML = html;
}

function renderGrid(){
  renderTodayBar();
  const y = state.year, m = state.month;
  const months = [0,1,2].map(off => {
    let yy=y, mm=m+off;
    while(mm>12){ mm-=12; yy++; }
    return [yy,mm];
  });
  document.getElementById("monthTitle").textContent =
    `${months[0][0]}년 ${months[0][1]}월 ~ ${months[2][0]}년 ${months[2][1]}월`;
  document.getElementById("gridContainer").innerHTML =
    months.map(([yy,mm]) => buildMonthTable(yy,mm)).join("");
}

function openPopup(ev, person, ds){
  const popup = document.getElementById("popup");
  let html = `<button onclick="setCode('${person}','${ds}','')">💺 공란(정상근무)</button>`;
  for(const c of CODES){ html += `<button onclick="setCode('${person}','${ds}','${c}')">${ICONS[c]} ${c}</button>`; }
  popup.innerHTML = html;
  const rect = ev.target.getBoundingClientRect();
  popup.style.left = (window.scrollX + rect.left) + "px";
  popup.style.top = (window.scrollY + rect.bottom + 4) + "px";
  popup.classList.add("open");
  setTimeout(()=>{ document.addEventListener("click", closePopupOnce); }, 0);
}
function closePopupOnce(e){
  const popup = document.getElementById("popup");
  if(!popup.contains(e.target)){ popup.classList.remove("open"); document.removeEventListener("click", closePopupOnce); }
}
function setCode(person, ds, code){
  if(!state.data[person]) state.data[person] = {};
  if(code) state.data[person][ds] = code; else delete state.data[person][ds];
  state.dirty = true;
  document.getElementById("saveBtn").disabled = false;
  document.getElementById("saveStatus").textContent = "저장되지 않은 변경사항이 있습니다.";
  document.getElementById("saveStatus").classList.add("dirty");
  document.getElementById("popup").classList.remove("open");
  renderGrid();
}

document.getElementById("settingsToggle").addEventListener("click", ()=>{
  document.getElementById("settingsBox").classList.toggle("open");
});
document.getElementById("ghSaveSettings").addEventListener("click", saveSettings);
document.getElementById("refreshBtn").addEventListener("click", loadFromGithub);
document.getElementById("saveBtn").addEventListener("click", saveToGithub);
document.getElementById("prevMonth").addEventListener("click", ()=>{
  state.month--; if(state.month<1){state.month=12; state.year--;} renderGrid();
});
document.getElementById("nextMonth").addEventListener("click", ()=>{
  state.month++; if(state.month>12){state.month=1; state.year++;} renderGrid();
});
document.getElementById("todayJump").addEventListener("click", ()=>{
  const t = new Date();
  state.year = t.getFullYear(); state.month = t.getMonth()+1;
  renderGrid();
});

loadSettingsUI();
renderGrid();
if(ls("gh_owner") && ls("gh_repo")) loadFromGithub();
</script>
</body>
</html>
